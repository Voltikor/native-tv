<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Native Tv Home</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
</style>
</head>
<body>
<script>
/*
 * LG's Home, as the TV opens it: mounted over LG's Home under its id
 * (src/daemon/home_takeover_*). It has no screen. It asks the app manager for
 * the native client's Home screen. Relaunches stay in the background so an
 * already-visible client never has to give way to this empty page.
 * The client is the Native Tv tile's app, com.tvweb.dashboard: the one native
 * app sam is told of, which opens the dashboard unless a screen is named.
 *
 * There is no page to fall back to. A launch the app manager refuses is asked
 * again; the server decides when the client has failed for good, and then gives
 * LG's Home its place back (src/daemon/home_orchestrator.cpp).
 */
(function () {
  var APP_ID = 'com.tvweb.dashboard';
  var RETRY_MS = 3000;
  // Rewritten to match config.json by the stager and the launcher sync, which
  // both look for this line; the launch does not use it.
  var PORT = 8080;                // tvweb:port
  var timer = null;

  function retry() {
    clearTimeout(timer);
    timer = setTimeout(launch, RETRY_MS);
  }

  function answered(reply) {
    if (!reply || reply.returnValue !== true) retry();
  }

  // webOS.service where the platform provides it; the bridge under it otherwise.
  function call(uri, parameters, success, failure) {
    var slash = uri.indexOf('/', 'luna://'.length);
    var service = window.webOS && window.webOS.service;
    if (service && typeof service.request === 'function') {
      service.request(uri.slice(0, slash), {
        method: uri.slice(slash + 1),
        parameters: parameters,
        onSuccess: function (reply) {
          if (reply && reply.returnValue === true) success(reply);
          else failure();
        },
        onFailure: failure
      });
    } else if (window.PalmServiceBridge) {
      var bridge = new window.PalmServiceBridge();
      bridge.onservicecallback = function (message) {
        var reply = null;
        try { reply = JSON.parse(message); } catch (e) {}
        if (reply && reply.returnValue === true) success(reply);
        else failure();
      };
      bridge.call(uri, JSON.stringify(parameters));
    } else {
      failure();
    }
  }

  function foregroundFallback() {
    // Older firmware may refuse the input call. The existing visible redirect
    // and daemon watch remain the fallback; never retry a hidden Home request.
    if (window.PalmSystem && typeof window.PalmSystem.activate === 'function')
      window.PalmSystem.activate();
    retry();
  }

  function launch(background) {
    clearTimeout(timer);
    if (document.visibilityState === 'hidden' && background !== true) return;
    try {
      if (background === true) {
        call('luna://com.webos.applicationManager/getForegroundAppInfo', {}, function (reply) {
          if (reply.appId === APP_ID) {
            // Linux KEY_HOME is keyboard Home, not the remote's system Home:
            // only the foreground native client receives this navigation command.
            call('luna://com.webos.service.networkinput/test/sendKeyCode',
              { keyCode: 102 }, answered, foregroundFallback);
          } else {
            call('luna://com.webos.applicationManager/launch',
              { id: APP_ID, params: { screen: 'home' } }, answered, foregroundFallback);
          }
        }, foregroundFallback);
      } else {
        call('luna://com.webos.applicationManager/launch',
          { id: APP_ID, params: { screen: 'home' } }, answered, retry);
      }
    } catch (e) {
      if (background === true) foregroundFallback();
      else retry();
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') launch();
  });
  document.addEventListener('webOSRelaunch', function () { launch(true); });
  launch();
})();
</script>
</body>
</html>
