name: Visual baselines

on:
  push:
    branches: [feat/translations]
    paths: ['.github/workflows/visual-baselines.yml']
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native build dependencies
        timeout-minutes: 8
        run: bash scripts/ci-install-deps.sh cmake ninja-build g++ pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libjson-c-dev libcurl4-openssl-dev zlib1g-dev libgles2-mesa-dev
      - name: Build the client
        run: python3 native-tv/build.py --out native-tv/build-visual --target nativetv-tv
      - name: Render proposed baselines for review
        run: python3 native-tv/tests/golden/golden.py update --client native-tv/build-visual/nativetv-tv
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: native-tv/tests/golden/*.png
